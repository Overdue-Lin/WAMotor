shape_meta:
  images:
  - key: image
    raw_shape:
    - 3
    - 512
    - 512
    shape:
    - 3
    - 224
    - 224
  - key: wrist_image
    raw_shape:
    - 3
    - 512
    - 512
    shape:
    - 3
    - 224
    - 224
  action:
  - key: default
    raw_shape: 7
    shape: 7
  state:
  - key: default
    raw_shape: 8
    shape: 8
num_frames: 33
action_video_freq_ratio: 4
video_size:
- 224
- 448
concat_multi_camera: horizontal
processor:
  _target_: wamotor.processing.processors.fastwam_processor.FastWAMProcessor
  shape_meta: ${data.shape_meta}
  num_obs_steps: ${data.num_frames}
  num_output_cameras: 2
  action_output_dim: 7
  proprio_output_dim: 8
  delta_action_dim_mask:
    default:
    - true
    - true
    - true
    - true
    - true
    - true
    - false
  action_state_transforms: null
  use_stepwise_action_norm: false
  norm_default_mode: min/max
  norm_exception_mode: null
  action_state_merger:
    _target_: wamotor.processing.transforms.action_state_merger.ConcatLeftAlign
  image_transforms:
  - _target_: wamotor.processing.transforms.image.ToTensor
  - _target_: torchvision.transforms.Resize
    size:
    - 224
    - 224
